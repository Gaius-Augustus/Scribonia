[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scribonia"
dynamic = ["version"]
authors = [
  { name="Katharina J. Hoff", email="katharina.hoff@uni-greifswald.de" },
]
description = "Fast estimation of the genetic-code stop set of genomes and metagenomic bins."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["genetic code", "translation table", "stop codon", "ciliates",
            "metagenomics", "gene finding"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
train = ["scikit-learn>=1.3", "joblib"]
test = ["pytest"]

[project.scripts]
scribonia = "scribonia.cli:main"

[project.urls]
Homepage = "https://github.com/Gaius-Augustus/Scribonia"
Issues = "https://github.com/Gaius-Augustus/Scribonia/issues"

[tool.hatch.version]
path = "scribonia/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["scribonia"]
